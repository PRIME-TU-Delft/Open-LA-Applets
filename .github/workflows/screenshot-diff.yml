name: Screenshot Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: screenshot-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DIFF_THRESHOLD: '0.1'

jobs:
  pr-screenshots:
    name: Render PR screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium deps
        run: pnpm exec puppeteer browsers install chrome

      - name: Build
        run: pnpm build

      - name: Generate screenshots
        run: pnpm screenshots

      - name: Upload PR screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: build/client/applet
          retention-days: 7

  main-screenshots:
    name: Render/restore main baseline screenshots
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      # base.sha only updates on events for this PR, not when main advances
      # via other merged PRs, so it can be stale. Use the branch name instead.
      - name: Checkout main baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Resolve main baseline SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore main baseline cache
        id: cache
        uses: actions/cache@v4
        with:
          path: main-screenshots
          key: screenshots-main-${{ steps.base.outputs.sha }}

      - name: Set up pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install

      - name: Install Chromium deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm exec puppeteer browsers install chrome

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Generate screenshots
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm screenshots

      - name: Move screenshots into cache path
        if: steps.cache.outputs.cache-hit != 'true'
        run: mv build/client/applet main-screenshots

      - name: Upload main screenshots
        uses: actions/upload-artifact@v4
        with:
          name: main-screenshots
          path: main-screenshots
          retention-days: 7

  compare:
    name: Diff screenshots and comment
    needs: [pr-screenshots, main-screenshots]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download PR screenshots
        uses: actions/download-artifact@v5
        with:
          name: pr-screenshots
          path: pr-screenshots

      - name: Download main screenshots
        uses: actions/download-artifact@v5
        with:
          name: main-screenshots
          path: main-screenshots

      - name: Run diff
        run: |
          pnpm diff-screenshots \
            --before main-screenshots \
            --after pr-screenshots \
            --output screenshot-diff \
            --threshold "$DIFF_THRESHOLD"

      - name: Upload diff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diff
          path: screenshot-diff
          retention-days: 14

      # When at most 5 images changed, list them out (empty outputs for the
      # unused slots) so each can be uploaded as its own unarchived artifact
      # below, individually browsable with a direct link.
      - name: List changed diff images (up to 5)
        id: files
        run: |
          node -e "
            const fs = require('fs');
            const { changed } = require('./screenshot-diff/report.json');
            const files = changed
              .map((c) => 'screenshot-diff/diffs/' + c.route.replace(/\//g, '_') + '.png')
              .slice(0, 5);
            const lines = [];
            for (let i = 0; i < 5; i++) {
              lines.push(\`file-\${i + 1}=\${changed.length <= 5 ? (files[i] ?? '') : ''}\`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join('\n') + '\n');
          "

      - name: Upload diff image 1
        if: steps.files.outputs.file-1 != ''
        id: upload-image-1
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-image-1
          path: ${{ steps.files.outputs.file-1 }}
          archive: false
          retention-days: 14

      - name: Upload diff image 2
        if: steps.files.outputs.file-2 != ''
        id: upload-image-2
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-image-2
          path: ${{ steps.files.outputs.file-2 }}
          archive: false
          retention-days: 14

      - name: Upload diff image 3
        if: steps.files.outputs.file-3 != ''
        id: upload-image-3
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-image-3
          path: ${{ steps.files.outputs.file-3 }}
          archive: false
          retention-days: 14

      - name: Upload diff image 4
        if: steps.files.outputs.file-4 != ''
        id: upload-image-4
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-image-4
          path: ${{ steps.files.outputs.file-4 }}
          archive: false
          retention-days: 14

      - name: Upload diff image 5
        if: steps.files.outputs.file-5 != ''
        id: upload-image-5
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diff-image-5
          path: ${{ steps.files.outputs.file-5 }}
          archive: false
          retention-days: 14

      - name: Upsert PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- screenshot-diff-report -->';
            const summary = fs.readFileSync('screenshot-diff/summary.md', 'utf-8');

            const imageUrls = [
              '${{ steps.upload-image-1.outputs.artifact-url }}',
              '${{ steps.upload-image-2.outputs.artifact-url }}',
              '${{ steps.upload-image-3.outputs.artifact-url }}',
              '${{ steps.upload-image-4.outputs.artifact-url }}',
              '${{ steps.upload-image-5.outputs.artifact-url }}'
            ].filter(Boolean);

            const imagesLine = imageUrls.length > 0
              ? `Changed diff image${imageUrls.length === 1 ? '' : 's'}, attached directly:\n` +
                imageUrls.map((url) => `- ${url}`).join('\n')
              : `Before/after/diff images are attached as the \`screenshot-diff\` workflow artifact ` +
                `on this run: ${context.payload.pull_request.html_url}/checks`;

            const body = `${marker}\n## Screenshot diff report\n\n${summary}\n\n${imagesLine}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
